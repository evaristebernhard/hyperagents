[package]
name = "hyperagents-kernel"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[workspace]
exclude = ["vendor/infinity"]
[dependencies]
infinity-agent-core = { path = "vendor/infinity/crates/infinity-agent-core" }
infinity-provider-protocol = { path = "vendor/infinity/crates/infinity-provider-protocol" }
rap-protocol = { path = "vendor/infinity/crates/rap-protocol" }
async-trait = "0.1"
futures-util = "0.3"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

axum = "0.8"
